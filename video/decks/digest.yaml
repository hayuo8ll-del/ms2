  # ======================================================================

  - layout: code
    chapter: "02. セットアップ"
    title: "インストール"
    code: |
      # macOS / Linux / WSL
      $ curl -fsSL https://claude.ai/install.sh | bash

      # Windows PowerShell
      $ irm https://claude.ai/install.ps1 | iex

      # Homebrew
      $ brew install --cask claude-code
    narration:
      - text: "インストールはコマンド 1 行です。この方法なら自動で更新されます。"
        read: "インストールはコマンド、いちぎょうです。この方法なら自動で更新されます。"
      - text: "Windows なら PowerShell 用のコマンドを使ってください。"
        read: "ウィンドウズなら、パワーシェル用のコマンドを使ってください。"
      - text: "Homebrew や WinGet でも入りますが、こちらは自動更新されない点に注意してください。"
        read: "ホームブリューや、ウィンゲットでも入りますが、こちらは自動更新されない点に注意してください。"

  - layout: code
    chapter: "02. セットアップ"
    title: "確認して起動する"
    code: |
      # インストールできたか確認
      $ claude --version

      # プロジェクトのディレクトリで起動
      $ cd your-project
      $ claude
    narration:
      - text: "インストールできたら、バージョンを表示して確認します。"
