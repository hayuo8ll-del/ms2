# サンプル動画（約 90 秒）
#
# 機械音声の品質を確認するための短い試作。内容は README.md の
# 「5分クイックスタート」と docs/01-overview.md の「チャット版との違い」から。
#
# narration の各要素が 1 セグメント（= 字幕 1 枚 = 音声 1 本）になる。
# 文字列で書くと表示と読み上げが同じテキストになり、
# text / read に分けて書くと、表示は英語表記のまま読みだけカタカナにできる。
# OpenJTalk は英単語をアルファベット 1 文字ずつ読んでしまうため、
# 固有名詞にはほぼ必ず read を添えること。

meta:
  title: "Claude Code 使い方ガイド サンプル"
  width: 1920
  height: 1080
  fps: 30
  gap: 0.35 # セグメント間に入れる無音（秒）
  speed: 1.0 # 読み上げ速度
  # voicevox を使うには先に setup_voicevox.sh を実行すること。
  # 未セットアップなら engine: openjtalk に変えれば追加インストール無しで動く。
  engine: voicevox
  speaker: 30 # No.7 アナウンス（ナレーション向けのスタイル）

slides:
  - layout: title
    chapter: "サンプル"
    title: "Claude Code とは"
    subtitle: "コードを実際に触れる AI エージェント"
    narration:
      - text: "Claude Code の使い方を、これから順番に見ていきます。"
        read: "クロードコードの使い方を、これから順番に見ていきます。"
      - text: "この動画はサンプルです。音声の聞こえ方を確認してください。"
        read: "この動画はサンプルです。音声の聞こえ方を確認してください。"

  - layout: bullets
    chapter: "01. Claude Code とは"
    title: "チャット版 Claude との違い"
    reveal: true
    bullets:
      - "自分でファイルを探して読む"
      - "実際にコードを書き換える"
      - "テストを実行して、失敗すれば直す"
    narration:
      - text: "チャット版の Claude は、貼り付けたコードを読んで答えます。"
        read: "チャット版のクロードは、貼り付けたコードを読んで答えます。"
      - text: "Claude Code は違います。自分でファイルを探し、実際に書き換えます。"
        read: "クロードコードは違います。自分でファイルを探し、実際に書き換えます。"
      - text: "さらにテストを実行し、失敗すれば自分で直して、通るまで繰り返します。"
        read: "さらにテストを実行し、失敗すれば自分で直して、通るまで繰り返します。"

  - layout: code
    chapter: "02. セットアップ"
    title: "インストールは 3 行"
    code: |
      # 1. インストール（macOS / Linux / WSL）
      $ curl -fsSL https://claude.ai/install.sh | bash

      # 2. 確認
      $ claude --version

      # 3. プロジェクトで起動
      $ cd your-project && claude
    narration:
      - text: "インストールはコマンド 1 行で終わります。"
        read: "インストールはコマンド、いちぎょうで終わります。"
      - text: "あとはプロジェクトのフォルダに移動して、claude と打つだけです。"
        read: "あとはプロジェクトのフォルダに移動して、クロードと打つだけです。"

  - layout: bullets
    chapter: "03. 最初の一歩"
    title: "起動したら、まず聞いてみる"
    reveal: true
    bullets:
      - "このプロジェクトは何をするもの？"
      - "テストはどうやって実行する？"
      - "README にセットアップ手順を追加して"
    narration:
      - text: "起動したら、まずコードベースについて質問してみてください。"
        read: "起動したら、まずコードベースについて質問してみてください。"
      - text: "先輩エンジニアに聞くような質問が、そのまま通じます。"
        read: "先輩エンジニアに聞くような質問が、そのまま通じます。"
      - text: "慣れてきたら、そのまま作業を頼みましょう。変更内容は承認してから反映されます。"
        read: "慣れてきたら、そのまま作業を頼みましょう。変更内容は承認してから反映されます。"

  - layout: title
    chapter: "サンプルはここまで"
    title: "続きはガイド本編で"
    subtitle: "全 13 章 / インストールから自動化まで"
    narration:
      - text: "本編では、効果的な指示の書き方や権限設定まで詳しく扱います。"
        read: "本編では、効果的な指示の書き方や権限設定まで詳しく扱います。"
      - text: "この音声で問題なければ、このまま本編を作成します。"
        read: "この音声で問題なければ、このまま本編を作成します。"
