name: Deploy app to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時に走らせない。実行中のデプロイは中断しない。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 各アプリに埋め込んだセルフテスト（?selftest=1）を Chrome で実行する。
  # 生成ロジックが壊れた状態でデプロイしないための関門。
  selftest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: config-generator
            page: app/index.html
          - name: minecraft-blueprint
            page: app/minecraft/index.html
    steps:
      - uses: actions/checkout@v4

      - name: セルフテストを実行（${{ matrix.name }}）
        run: |
          google-chrome --headless=new --disable-gpu --no-sandbox \
            --virtual-time-budget=5000 \
            --dump-dom "file://$PWD/${{ matrix.page }}?selftest=1" > dom.html
          sed -n 's/.*\(SELFTEST: [0-9]* passed, [0-9]* failed\).*/\1/p' dom.html | head -1
          grep -q "SELFTEST: [0-9]* passed, 0 failed" dom.html

      - name: 失敗したテストを表示
        if: failure()
        run: sed -n '/SELFTEST/,/<\/pre>/p' dom.html || true

  deploy:
    needs: selftest
    # プレビュー用の PR ビルドではデプロイしない
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Jekyll による加工を止める
        run: touch app/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app

      - id: deployment
        uses: actions/deploy-pages@v4

      # deploy-pages は、Settings > Pages の Source が GitHub Actions に
      # なっていなくてもデプロイを作成して成功を報告する。その状態だと
      # 「CI は緑なのにサイトは 404」になるので、実際に取得して確かめる。
      # ステータスだけでなく <title> まで見る（配信されていない場合でも
      # 200 が返る経路があるため）。
      - name: 配信されているか確認
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          base="${PAGE_URL%/}"
          check() {
            url="$1"
            want="$2"
            code=""
            for i in 1 2 3 4 5; do
              code=$(curl -sSL -o /tmp/page.html -w '%{http_code}' --max-time 20 "$url") || code="000"
              if [ "$code" = "200" ] && grep -q "$want" /tmp/page.html; then
                echo "OK  $url"
                return 0
              fi
              echo "$url は HTTP $code（$i 回目）。10 秒待って再試行します"
              sleep 10
            done
            echo "::error::$url を配信できていません（最後の HTTP $code）。Settings > Pages > Build and deployment > Source が GitHub Actions になっているか確認してください"
            return 1
          }
          check "$base/" "<title>Claude Code 設定ジェネレータ</title>"
          check "$base/minecraft/" "<title>マイクラ建築図面ジェネレータ</title>"
